services:
  journals-backend:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    image: journals-backend
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/var/www/html

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
